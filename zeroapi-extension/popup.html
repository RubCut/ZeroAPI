<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; font-family: "Segoe UI", sans-serif; background: #0f0f12; color: #e8e8ec; }
    .wrap { padding: 16px; }
    h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .ver { font-size: 9.5px; font-weight: 500; letter-spacing: 0.2px; color: rgba(255,255,255,0.55); background: none; border: none; padding: 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
    .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .dot.warn { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .dot.api { background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }
    .row { font-size: 12px; opacity: 0.9; margin: 6px 0; line-height: 1.4; }
    .row.small { font-size: 11px; opacity: 0.6; }
    button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .primary { background: #0a84ff; color: white; }
    .ghost { background: rgba(255,255,255,0.08); color: #e8e8ec; }
    .kofi { background: rgba(255,105,135,.16); color: #ff8fa3; border: 1px solid rgba(255,105,135,.4) !important; font-weight: 700; }
    code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .status-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; margin: 10px 0; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 10px; background: #222; margin-right: 4px; }
    .badge.ok { background: #34d399; color: #000; }
    .badge.warn { background: #fbbf24; color: #000; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span id="dot" class="dot"></span> ZeroAPI <span id="ver" class="ver"></span> <span style="font-size:9px;opacity:.6">OpenAI API</span></h1>
    
    <div class="status-card">
      <div class="row" id="api-state">API Server: checking...</div>
      <div class="row" id="legacy-state">Legacy Bridge: checking...</div>
      <div class="row small" id="browsers">Browsers: -</div>
    </div>

    <div class="row" id="state">Initializing...</div>
    <div class="row" id="tools"></div>
    <div class="row small" id="servers" style="white-space:pre-line; font-family:ui-monospace,monospace;"></div>

    <button class="primary" id="open-dashboard">📊 Open Dashboard (localhost:8000)</button>
    <button class="ghost" id="reconnect">↻ Reconnect</button>
    <button class="ghost" id="restart">⟳ Restart Roblox server</button>
    <button class="ghost" id="settings">⚙ Settings & Switch AI</button>
    <button class="kofi" id="kofi">♥ Tip the developer</button>
    
    <div class="row small" style="margin-top:12px;">
      <b>Quick start:</b><br>
      1. Run <code>python -m server.main</code> or <code>start_api.bat</code><br>
      2. Open <code>chat.deepseek.com</code> or <code>chatgpt.com</code><br>
      3. Use OpenAI SDK with <code>base_url=http://localhost:8000/v1</code>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
